[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hazard-info-maps"
version = "0.1.0"
description = "Build aligned flood, population, infrastructure, buildings/roads and coastal rasters from public data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "numpy", "pandas", "requests", "shapely", "geopandas", "rasterio", "matplotlib", "pillow",
]

[project.optional-dependencies]
basemap = ["contextily"]
dev = ["pytest"]

[project.scripts]
hazardmaps = "hazardmaps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
